[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "local-tracker"
version = "0.1.0"
description = "A private, offline time tracker for GNOME"
requires-python = ">=3.11,<3.14"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Local Tracker contributors" }]

[project.scripts]
local-tracker = "local_tracker.__main__:main"

[tool.setuptools]
packages = ["local_tracker"]

[tool.setuptools.package-data]
local_tracker = ["style.css"]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "mypy>=2.3.1",
    "pytest>=9.0.0",
]

[tool.uv]
package = true
python-preference = "only-system"

[tool.black]
target-version = ["py313"]
line-length = 88

[tool.mypy]
python_version = "3.13"
files = ["local_tracker", "tests"]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["build-dir", ".flatpak-builder", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
